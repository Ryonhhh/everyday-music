<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程页 · 每日音乐学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/site-extra.css">
<link rel="stylesheet" href="assets/reading.css">
</head>
<body style="background:var(--ground)">
<div class="read-progress" id="readProgress" aria-hidden="true"></div>

<div class="read-shell">
  <a class="detail-back" href="index.html">← 返回主页</a>

  <div id="skeleton">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-line" style="width:60%"></div>
    <div class="skeleton skeleton-line" style="width:100%;margin-top:16px"></div>
    <div class="skeleton skeleton-line" style="width:92%"></div>
    <div class="skeleton skeleton-line" style="width:84%"></div>
  </div>

  <div id="content" hidden>
    <div class="read-layout">
      <header class="detail-head" id="detailHead">
        <div class="kicker" id="detailKicker"></div>
        <h1 id="detailTitle"></h1>
        <p class="byline" id="detailByline"></p>
      </header>

      <aside class="read-rail">
        <figure class="album-cover" id="albumCover" hidden>
          <img id="albumCoverImg" alt="">
        </figure>
        <dl class="facts" id="detailFacts" hidden></dl>
        <nav class="listen" id="albumListen" hidden aria-label="在线收听与资料"></nav>
        <nav class="toc" id="lessonToc" hidden aria-label="本课大纲"></nav>
      </aside>

      <article class="article" id="detailBody"></article>

      <nav class="lesson-nav" id="lessonNav" hidden></nav>
    </div>
  </div>

  <div id="error" hidden>
    <h1>没有找到这一页</h1>
    <div class="detail-meta">该内容不存在或已被删除。<a href="index.html">返回主页</a></div>
  </div>
</div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
